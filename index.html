<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Split the restaurant bill: scan the receipt, tap who had what, done." />
    <meta name="theme-color" content="#F28C28" />
    <title>Tabby — split the tab</title>
    <script>
      // Runs before first paint: apply the saved theme, and skip the splash when it
      // was already shown this session or when opening a shared bill link.
      ;(function () {
        var theme = 'system'
        try {
          theme = JSON.parse(localStorage.getItem('tabby:prefs')).state.theme || 'system'
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        var seen = false
        try {
          seen = sessionStorage.getItem('tabby:splash') === '1'
        } catch (e) {}
        if (seen || location.hash.indexOf('#b=') === 0) {
          document.documentElement.classList.add('no-splash')
        }
      })()
    </script>
    <style>
      :root {
        --logo-orange: #f28c28;
        --logo-ink: #2b2118;
        --logo-paper: #fff8ee;
        --splash-bg: #fff8ee;
      }
      .dark {
        --splash-bg: #14110f;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: var(--splash-bg);
        transition: opacity 300ms ease-out;
        cursor: pointer;
      }
      .no-splash #splash {
        display: none;
      }
      #splash.splash--out {
        opacity: 0;
        pointer-events: none;
      }
      #splash .splash-logo {
        width: 128px;
        height: 128px;
        animation: splash-pop 300ms cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
      }
      #splash .splash-word {
        font: 800 40px/1 ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
        color: var(--logo-orange);
        letter-spacing: -0.02em;
        animation: splash-fade 300ms 120ms ease-out both;
      }
      @keyframes splash-pop {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
      }
      @keyframes splash-fade {
        from {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash {
          transition-duration: 150ms;
        }
        #splash .splash-logo,
        #splash .splash-word {
          animation: splash-fade 150ms ease-out both;
        }
      }
    </style>
  </head>
  <body>
    <!-- Splash: inline so it paints before JS loads. Logo artwork mirrors src/brand/Logo.tsx. -->
    <div id="splash" role="img" aria-label="Tabby">
      <svg class="splash-logo" viewBox="0 0 128 128" aria-hidden="true">
        <g stroke="var(--logo-ink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <path fill="var(--logo-orange)" d="M22 104V58L17 12l31 21q16-5 32 0l31-21-5 46v46" />
          <path
            fill="var(--logo-paper)"
            d="M22 78h84v26l-7 7-7-7-7 7-7-7-7 7-7-7-7 7-7-7-7 7-7-7-7 7-7-7z"
          />
          <path fill="none" d="M50 40h28M45 49h37M48 58h18m8 0h7" />
          <path fill="none" d="M44 92H10m34 6-33 6m33-12-32-8M84 92h34m-34 6 33 6m-33-12 32-8" />
          <path fill="var(--logo-ink)" d="M59 84h10l-5 6z" />
          <path fill="none" d="M64 90q-3 7-9 5m9-5q3 7 9 5" />
        </g>
        <ellipse cx="46" cy="68" rx="5" ry="7" fill="var(--logo-ink)" />
        <ellipse cx="82" cy="68" rx="5" ry="7" fill="var(--logo-ink)" />
      </svg>
      <div class="splash-word" aria-hidden="true">Tabby</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
